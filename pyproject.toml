[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-jev"
version = "0.1.0"
description = "Strands Agents tools around Jev, TypeSafe's System One decision model: every primitive, pattern and cookbook as a tool an agent can call"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Cagatay Cali"}]
keywords = ["strands", "agents", "jev", "typesafe", "system-one", "decision-model", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "strands-agents>=1.51.0",
    "typesafe-sdk>=0.7.0",
    "pydantic>=2.0.0",
]

[project.urls]
Repository = "https://github.com/cagataycali/strands-jev"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    "hatch",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strands_jev"]

[tool.hatch.envs.default]
dependencies = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
live = "pytest -m live {args}"
lint = "ruff check src tests examples"
format = "ruff format src tests examples"
format-check = "ruff format --check src tests examples"
typecheck = "mypy src"
prepare = ["format", "lint", "typecheck", "test"]

[tool.ruff]
line-length = 120
include = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = [
    "live: talks to the real Jev endpoint (needs TYPESAFE_API_KEY or ~/.typesafe); costs money",
    "bedrock: additionally needs AWS credentials for the agent's own model",
]

[tool.ruff.lint.per-file-ignores]
# Live test files are mostly case data: long sentences a reader should see whole.
"tests/live/*" = ["E501"]
